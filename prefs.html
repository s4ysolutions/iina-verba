<!doctype html>
<html>
  <body>
    <div class="pref-section">
      Verba server URL:
      <div style="margin-top: 2px">
        <input type="text" data-pref-key="server_url" style="width: 100%" />
      </div>
      <p class="small secondary pref-help">
        The page that opens when you add a word. Default: https://verba.s4y.solutions
      </p>
    </div>
    <div class="pref-section">
      Shortcut for "Add to Verba":
      <div style="margin-top: 2px">
        <input type="text" data-pref-key="shortcut" style="width: 60px" />
      </div>
      <p class="small secondary pref-help">
        One key, for example a. Restart IINA after you change it.
      </p>
    </div>
  </body>
</html>
